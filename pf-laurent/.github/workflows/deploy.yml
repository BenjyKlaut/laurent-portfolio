name: Deploy pf-laurent to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci
        working-directory: pf-laurent

      - name: Build (with correct VITE_BASE)
        run: npm run build
        working-directory: pf-laurent
        env:
          VITE_BASE: /laurent-portfolio/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: pf-laurent/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

name: Build and deploy pf-laurent to gh-pages branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd pf-laurent
          npm ci

      - name: Build
        run: |
          cd pf-laurent
          npm run build

      - name: Prepare dist
        run: |
          cd pf-laurent
          # ensure .nojekyll so GitHub Pages serves files correctly
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pf-laurent/dist
          publish_branch: gh-pages
